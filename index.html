<!DOCTYPE html>
<html lang="pt-BR" data-theme="fada">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grimório · Cael</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
:root{--serif:'Alegreya',Georgia,serif;--sans:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--title:'Cinzel Decorative',Georgia,serif;--r:12px;--r2:8px}
/* Fada: violeta + magenta (análogas), verde-menta como complementar para o divino */
[data-theme="fada"]{--bg:#120f1a;--surface:#1c1727;--surface2:#262036;--border:#4a4063;--text:#eee8f7;--text2:#c4b9d6;--muted:#a196b6;--accent:#c3a6ff;--accent2:#f2a7cf;--on-accent:#1a1028;
 --pv:#ff8fa3;--campo:#7fd8e6;--pma:#8fb4ff;--pmd:#8fdca8;--pa:#f5cf72;--danger:#ff7a7a;
 --sch-fogo:#ff9a62;--sch-def:#8fb4ff;--sch-ilusao:#e39bf0;--sch-natureza:#8fdca8;--sch-util:#c2d39f;--sch-sprite:#c3a6ff;--shadow:0 20px 60px rgba(0,0,0,.55);color-scheme:dark}
/* Chamas: laranja + âmbar (análogas), azul como complementar para o arcano */
[data-theme="chamas"]{--bg:#15100c;--surface:#201812;--surface2:#2b2018;--border:#5a4430;--text:#f5ece2;--text2:#d6c2ae;--muted:#ae9984;--accent:#ffa45c;--accent2:#ffd166;--on-accent:#1e1208;
 --pv:#ff8a7a;--campo:#7fd3e0;--pma:#93b5ff;--pmd:#9bd98f;--pa:#ffd166;--danger:#ff7b6b;
 --sch-fogo:#ff8a4c;--sch-def:#93b5ff;--sch-ilusao:#e2a0e6;--sch-natureza:#9bd98f;--sch-util:#cfc690;--sch-sprite:#d0b3ff;--shadow:0 20px 60px rgba(0,0,0,.6);color-scheme:dark}
/* Pergaminho: tema claro para ambientes iluminados */
[data-theme="pergaminho"]{--bg:#efe6d3;--surface:#faf5ea;--surface2:#f1e7d4;--border:#a8916a;--text:#2b2118;--text2:#4f3f2e;--muted:#6a5843;--accent:#6b3aa8;--accent2:#9c3d2a;--on-accent:#ffffff;
 --pv:#a8213a;--campo:#1b6573;--pma:#2a4fa8;--pmd:#2b7041;--pa:#7d5800;--danger:#ad2318;
 --sch-fogo:#a8411a;--sch-def:#2a4fa8;--sch-ilusao:#86358f;--sch-natureza:#2b7041;--sch-util:#566428;--sch-sprite:#6b3aa8;--shadow:0 20px 50px rgba(60,40,10,.25);color-scheme:light}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
strong{font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.3}
[data-theme="pergaminho"] #fx{display:none}
.app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh}

/* ── Cabeçalho ── */
.hdr{display:flex;align-items:center;gap:1rem 1.5rem;padding:.9rem 1.5rem;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.hdr-id{flex:1;min-width:240px}
.hdr-name{font-family:var(--title);font-size:1.9rem;color:var(--accent);line-height:1.1}
.hdr-sub{font-size:.95rem;color:var(--text2)}
.hdr-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface2)}
.seg button{background:none;border:0;padding:.45rem .85rem;cursor:pointer;color:var(--text2);font-size:.92rem;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:.45rem .9rem;cursor:pointer;font-size:.95rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:40px;color:var(--text);transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:800}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:34px;padding:.25rem .6rem;font-size:.9rem;min-width:40px}
.save-flag{font-size:.82rem;color:var(--muted);white-space:nowrap}
.save-flag.err{color:var(--danger);font-weight:700}

/* ── Recursos ── */
.res{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.75rem;padding:.9rem 1.5rem;border-bottom:1px solid var(--border)}
.rc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .85rem .75rem;--c:var(--text)}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.rc-label{font-size:.82rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text2)}
.rc-label span{color:var(--c)}
.rc-hint{font-size:.8rem;color:var(--muted)}
.rc-val{font-size:2.1rem;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums;line-height:1.15}
.rc-max{font-size:1rem;color:var(--muted);font-weight:500}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:.35rem 0 .55rem}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
.rc-btns{display:flex;gap:.3rem;flex-wrap:wrap}
.rc.r-pv{--c:var(--pv)}.rc.r-campo{--c:var(--campo)}.rc.r-pma{--c:var(--pma)}.rc.r-pmd{--c:var(--pmd)}.rc.r-pa{--c:var(--pa)}
.rc.low{--c:var(--danger)}

/* ── Estatísticas de combate ── */
.hud{position:sticky;top:0;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.stats-bar{display:flex;flex-wrap:wrap;gap:.35rem .45rem;padding:.5rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface)}
.st{font-size:.93rem;color:var(--text2);background:var(--surface2);border-radius:99px;padding:.18rem .7rem}
.st b{color:var(--text);font-weight:800;font-variant-numeric:tabular-nums}
.st.hot b{color:var(--sch-fogo)}
.st.boost b{color:var(--accent)}
.st.debuff b{color:var(--danger)}
.tile.debuff{border-color:var(--danger)}.tile.debuff dd{color:var(--danger)}
.conds{display:flex;flex-wrap:wrap;gap:.3rem}
.cchip{border:1px solid var(--border);background:var(--surface2);border-radius:99px;padding:.2rem .65rem;font-size:.9rem;cursor:pointer;min-height:34px;color:var(--text)}
.cchip:hover{border-color:var(--danger)}
.cchip[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);color:var(--bg);font-weight:700}
.cchip.implied{border:1px dashed var(--danger);color:var(--danger)}
.cond-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;padding:.4rem 1.5rem;border-bottom:1px solid var(--border);background:var(--surface)}
.cond-bar.on{background:color-mix(in srgb,var(--danger) 10%,var(--surface))}
.cond-title{font-size:.8rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cond-bar.on .cond-title{color:var(--danger)}
.cgroup{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}
.cgroup .cond-who{color:var(--text2)}
.cgroup.on .cond-who{color:var(--danger)}
.cadd{width:30px;height:30px;border-radius:50%;border:1px dashed var(--border);background:var(--surface2);cursor:pointer;font-weight:800;color:var(--text2)}
.cadd:hover{border-color:var(--danger);color:var(--danger)}
.cact{font-size:.85rem;font-weight:700;color:var(--danger)}
.cp-n{background:none;border:0;cursor:pointer;color:inherit;font:inherit;font-weight:inherit;padding:0;white-space:nowrap;display:inline-flex;align-items:center;gap:.25rem;min-height:26px}
.cpill{white-space:nowrap}
.cpop{position:fixed;z-index:75;width:min(460px,calc(100vw - 16px));max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);border:1px solid var(--danger);border-radius:var(--r);box-shadow:var(--shadow);padding:.85rem .95rem 1rem}
.cpop[hidden]{display:none}
.cpop-h{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.6rem}
.cpop-h h3{font-family:var(--serif);font-size:1.2rem}
.cpop-hint{font-size:.86rem;color:var(--muted);margin:.5rem 0 0}
.pet-cond-btn{margin:.1rem 0 .3rem}
.cond-box{margin-top:.5rem}
.cond-row{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center}
.cond-who{font-weight:800;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--danger);margin-right:.2rem}
.cpill{display:inline-flex;align-items:center;gap:.2rem;border:1.5px solid var(--danger);color:var(--danger);border-radius:99px;padding:.1rem .25rem .1rem .7rem;font-weight:700;font-size:.92rem;background:var(--surface)}
.cpill.implied{border-style:dashed;font-weight:500;padding-right:.7rem}
.cpill > button:not(.cp-n){background:none;border:0;cursor:pointer;color:inherit;width:26px;height:26px;border-radius:50%;font-size:1rem;line-height:1}
.cpill > button:not(.cp-n):hover{background:color-mix(in srgb,var(--danger) 20%,transparent)}
.cflags{font-size:.97rem;color:var(--text);margin-top:.4rem;line-height:1.5}
.cflags strong{color:var(--danger)}
.cond-rules{margin-top:.35rem;font-size:.95rem}
.cond-rules summary{cursor:pointer;color:var(--text2);font-weight:700;min-height:32px;display:flex;align-items:center}
.cond-rules dt{font-weight:800;margin-top:.45rem;color:var(--text)}
.cond-rules dd{color:var(--text2);line-height:1.5}
.cond-act{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.45rem}
.mdl-warn{flex-basis:100%;font-size:.95rem;color:var(--danger);font-weight:700}

/* ── Abas ── */
.tabs{display:flex;gap:.25rem;overflow-x:auto;padding:.5rem 1.5rem 0;border-bottom:1px solid var(--border);scrollbar-width:thin;background:var(--bg)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:.6rem .9rem;cursor:pointer;color:var(--text2);font-size:.98rem;font-weight:700;white-space:nowrap;display:flex;gap:.4rem;align-items:center}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--tc,var(--accent));border-bottom-color:var(--tc,var(--accent))}
.tab-sep{width:1px;background:var(--border);margin:.5rem .35rem}

/* ── Layout principal ── */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;flex:1;align-items:start}
.content{padding:1.25rem 1.5rem 4rem;min-width:0}
.ph{margin-bottom:1rem}
.ph h2{font-family:var(--serif);font-size:1.6rem;color:var(--tc,var(--text));line-height:1.2}
.ph p{color:var(--text2);max-width:80ch;font-size:1rem;margin-top:.2rem}
.sec{font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:1.4rem 0 .6rem;display:flex;align-items:center;gap:.6rem}
.sec::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── Cards compactos ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.7rem}
.card{display:flex;align-items:center;gap:.8rem;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--sc);border-radius:var(--r);padding:.75rem .9rem;cursor:pointer;width:100%;min-height:74px;transition:background .15s,transform .15s}
.card:hover{background:var(--surface2);transform:translateY(-1px)}
.card-ico{font-size:1.35rem;width:2.4rem;height:2.4rem;flex-shrink:0;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--sc) 20%,transparent)}
.card-main{flex:1;min-width:0;display:flex;flex-direction:column}
.card-name{font-family:var(--serif);font-weight:700;font-size:1.14rem;color:var(--text);line-height:1.25}
.star{color:var(--accent2)}
.card-meta{font-size:.9rem;color:var(--text2)}
.card-dmg{font-size:.9rem;color:var(--sc);font-weight:700}
.pm{font-weight:800;font-size:.92rem;white-space:nowrap;padding:.12rem .6rem;border-radius:99px;border:1.5px solid currentColor;flex-shrink:0}
.pm-arc{color:var(--pma)}.pm-div{color:var(--pmd)}
.card.off{opacity:.72}

/* ── Painéis de texto (talentos, combos, companheiros, itens) ── */
.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:.9rem;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--surface2)}
.panel-h h3{font-family:var(--serif);font-size:1.2rem;line-height:1.25}
.chip{font-size:.82rem;font-weight:700;padding:.12rem .55rem;border-radius:99px;border:1px solid var(--border);color:var(--text2);white-space:nowrap}
.chip.cost{color:var(--pma);border-color:currentColor}
.panel-b{padding:.85rem 1rem;font-size:1rem;line-height:1.6}
.panel-b p+p{margin-top:.5rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;margin:.6rem 0}
.kv dt{color:var(--muted);font-weight:700;font-size:.9rem}
.kv dd{color:var(--text)}
.steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:.5rem}
.steps li{counter-increment:s;display:flex;gap:.6rem}
.steps li::before{content:counter(s);flex-shrink:0;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;font-size:.85rem;margin-top:.1rem}
.result{margin-top:.75rem;padding:.6rem .8rem;border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 var(--r2) var(--r2) 0}
.note{margin-top:.6rem;color:var(--text2);font-style:italic;font-size:.95rem}
.mini-tbl{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.95rem}
.mini-tbl td,.mini-tbl th{border-bottom:1px solid var(--border);padding:.35rem .4rem;text-align:left}
.mini-tbl th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mini-tbl td:last-child{font-weight:700;text-align:right}
.skill-list{display:grid;grid-template-columns:1fr auto;gap:.1rem 1rem}
.skill-list div{padding:.4rem 0;border-bottom:1px solid var(--border)}
.skill-list .sv{font-weight:800;font-size:1.1rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.skill-list small{display:block;color:var(--muted);font-size:.85rem}
.mini-res{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--border)}
.mini-res b{font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--pv)}

/* ── Ficha de animal ── */
.pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:1rem;align-items:start}
.pet .panel-h{flex-wrap:wrap}
.pet-sub{font-size:.92rem;color:var(--text2);width:100%}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:.45rem;margin-bottom:.9rem}
.tile{background:var(--surface2);border:1px solid transparent;border-radius:var(--r2);padding:.45rem .6rem;text-align:center}
.tile dt{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile dd{font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile dd small{font-size:.8rem;font-weight:500;color:var(--muted)}
.tile.boost{border-color:var(--accent)}.tile.boost dd{color:var(--accent)}
.attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem;margin-bottom:.9rem}
.attr{text-align:center;border:1px solid var(--border);border-radius:var(--r2);padding:.3rem 0}
.attr b{display:block;font-size:.74rem;letter-spacing:.06em;color:var(--muted)}
.attr span{font-size:1.15rem;font-weight:800}.attr small{display:block;font-size:.82rem;color:var(--text2)}
.atk{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .6rem;padding:.6rem 0;border-top:1px solid var(--border)}
.atk-n{font-weight:700;font-size:1.05rem;flex:1;min-width:150px}
.atk-n small{display:block;font-weight:400;color:var(--text2);font-size:.9rem}
.atk.used .atk-n{opacity:.55;text-decoration:line-through}
.pet h4{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin:.9rem 0 .45rem}
.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.trait{font-size:.92rem;padding:.2rem .65rem;border-radius:99px;background:var(--surface2);border:1px solid var(--border)}
.trait.fire{border-color:var(--sch-fogo);color:var(--sch-fogo);font-weight:700}
.pet-pv{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;background:var(--surface2);border-radius:var(--r2);padding:.55rem .7rem;margin-bottom:.9rem}
.pet-pv .lbl{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.pet-pv b{font-size:1.9rem;color:var(--pv);font-variant-numeric:tabular-nums;line-height:1}
.pet-pv .bar{flex-basis:100%;margin:.2rem 0}
.sanct{margin-top:.4rem;padding:.5rem .7rem;border-left:4px solid var(--pmd);background:var(--surface2);border-radius:0 var(--r2) var(--r2) 0;font-size:.95rem}
@media(max-width:640px){.attrs{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(3,1fr)}}

/* ── Diário e formulários ── */
.dhead{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:1rem}
.dhead .seg{flex-wrap:wrap}
.dtop{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:1rem;margin-bottom:1.2rem;align-items:start}
.recap .panel-b{font-family:var(--serif);font-size:1.08rem;white-space:pre-wrap}
.counter{display:flex;align-items:baseline;gap:.4rem}
.counter b{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pa)}
.counter.xp b{color:var(--accent)}
.mini-form{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}
.mini-form input{flex:1;min-width:150px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:.4rem .6rem;color:var(--text);font:inherit;min-height:36px}
.mini-form input[type=number]{max-width:110px}
.txlog{list-style:none;margin-top:.6rem;font-size:.92rem;color:var(--text2)}
.txlog li{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0;border-bottom:1px solid var(--border)}
.txlog .pos{color:var(--pmd);font-weight:700}.txlog .neg{color:var(--danger);font-weight:700}
.dbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.8rem}
.dsearch{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:.5rem 1rem;color:var(--text);font:inherit;min-height:40px}
.ditem .panel-h{align-items:flex-start}
.ditem .panel-h h3{flex:1}
.ditem .meta{font-size:.9rem;color:var(--text2);margin-bottom:.35rem}
.ditem .txt{white-space:pre-wrap;font-family:var(--serif);font-size:1.06rem;line-height:1.6}
.ditem .txt.clip{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.ditem .lbl{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:.6rem}
.ditem.done{opacity:.6}
.chip.good{color:var(--pmd);border-color:currentColor}.chip.bad{color:var(--danger);border-color:currentColor}
.chip.warn{color:var(--pa);border-color:currentColor}.chip.info{color:var(--pma);border-color:currentColor}
.empty{padding:1.5rem;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
.field{display:flex;flex-direction:column;gap:.25rem}
.field.wide{grid-column:1/-1}
.field label{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:.55rem .7rem;color:var(--text);font:inherit;font-size:1rem;min-height:42px}
.field textarea{min-height:130px;resize:vertical;font-family:var(--serif);font-size:1.08rem;line-height:1.6}
.field textarea.tall{min-height:260px}
.field input:focus,.field select:focus,.field textarea:focus,.dsearch:focus,.mini-form input:focus{outline:2px solid var(--accent);outline-offset:1px}
.mf .danger{color:var(--danger);border-color:var(--danger);margin-right:auto}
@media(max-width:900px){.dtop{grid-template-columns:1fr}}

/* ── Barra lateral de buffs ── */
.side{position:sticky;top:var(--hud-h,0px);max-height:calc(100vh - var(--hud-h,0px) - 4.5rem);overflow-y:auto;border-left:1px solid var(--border);background:var(--surface);padding:1.1rem 1rem 2rem;display:flex;flex-direction:column;gap:1.2rem}
.side h3{font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:.55rem}
.side-close{display:none}
.pilhas{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem}
.pilhas button{border:1px solid var(--border);background:var(--surface2);border-radius:var(--r2);padding:.45rem 0;cursor:pointer;font-weight:800;min-height:40px}
.pilhas button[aria-pressed="true"]{background:var(--sch-fogo);border-color:var(--sch-fogo);color:var(--bg)}
.pilha-info{font-size:.92rem;color:var(--text2);margin-top:.45rem;line-height:1.45}
.buff{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:.55rem .7rem;cursor:pointer;margin-bottom:.4rem}
.buff:hover{border-color:var(--accent)}
.sw{width:38px;height:22px;border-radius:99px;background:var(--bg);border:1px solid var(--border);position:relative;flex-shrink:0;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.buff[aria-checked="true"] .sw{background:var(--accent);border-color:var(--accent)}
.buff[aria-checked="true"] .sw::after{transform:translateX(16px);background:var(--on-accent)}
.buff-t{flex:1;min-width:0}
.buff-n{display:block;font-weight:700;font-size:.98rem}
.buff-v{display:block;font-size:.88rem;color:var(--text2)}
.buff-pm{font-size:.82rem;color:var(--pma);font-weight:700;white-space:nowrap}
.side-hint{font-size:.88rem;color:var(--muted);line-height:1.45}

/* ── Janela de detalhes ── */
.mdl{position:fixed;inset:0;background:rgba(5,3,10,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:60;animation:fade .15s ease}
.mdl[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mdl-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(800px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;animation:rise .18s ease}
.mh{display:flex;gap:1rem;align-items:flex-start;padding:1.1rem 1.3rem;border-bottom:1px solid var(--border);background:linear-gradient(135deg,color-mix(in srgb,var(--sc) 22%,var(--surface)) 0%,var(--surface) 75%)}
.mh-ico{font-size:1.8rem;width:3.2rem;height:3.2rem;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 25%,transparent)}
.mh-txt{flex:1;min-width:0}
.mh-eyebrow{font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--sc)}
.mh h2{font-family:var(--serif);font-size:1.8rem;line-height:1.15}
.mh-lvl{font-family:var(--serif);font-style:italic;color:var(--text2);font-size:1.02rem}
.mh-nav{display:flex;gap:.3rem;flex-shrink:0}
.mb{overflow-y:auto;padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:1.2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:.5rem}
.stats div{background:var(--surface2);border-radius:var(--r2);padding:.5rem .75rem}
.stats dt{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats dd{font-size:1.02rem;color:var(--text);line-height:1.35}
.mb h3{font-size:.82rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:.45rem}
.desc{font-family:var(--serif);font-size:1.17rem;line-height:1.72;max-width:70ch}
.desc .rt{border-collapse:collapse;margin:.6rem 0;font-family:var(--sans);font-size:1rem}
.desc .rt td{border:1px solid var(--border);padding:.2rem .7rem}
.desc .rt td:first-child{font-weight:800;color:var(--sc);text-align:center}
.desc .rt tr.hit td{background:color-mix(in srgb,var(--sc) 22%,transparent)}
.tat{border-left:4px solid var(--sc);background:var(--surface2);border-radius:0 var(--r2) var(--r2) 0;padding:.8rem 1rem;font-size:1.04rem;line-height:1.62}
.tags{display:flex;gap:.35rem;flex-wrap:wrap}
.mf{display:flex;gap:.6rem;justify-content:flex-end;align-items:center;padding:.85rem 1.3rem;border-top:1px solid var(--border);flex-wrap:wrap;background:var(--surface)}
.mf .pool-left{margin-right:auto;font-size:.92rem;color:var(--text2)}
.calc{border:1px solid var(--border);border-radius:var(--r);padding:.9rem 1rem;background:color-mix(in srgb,var(--sc) 6%,var(--surface))}
.opts{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem;align-items:center}
.opt{display:flex;align-items:center;gap:.45rem;border:1px solid var(--border);border-radius:99px;padding:.35rem .85rem;cursor:pointer;font-size:.97rem;background:var(--surface);min-height:40px}
.opt input{accent-color:var(--accent);width:1.1rem;height:1.1rem;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed}
.opt small{color:var(--muted);font-size:.85rem}
.calc-out{display:flex;gap:1rem 1.6rem;flex-wrap:wrap;align-items:flex-end}
.big{font-size:2.3rem;font-weight:800;color:var(--sc);font-variant-numeric:tabular-nums;line-height:1.05}
.big-l{font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.calc-sub{font-size:.98rem;color:var(--text2)}
.calc-note{font-size:.92rem;color:var(--muted);margin-top:.6rem}
.roll{margin-top:.8rem;display:flex;flex-direction:column;gap:.35rem}
.roll-row{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.die{min-width:2.1rem;text-align:center;padding:.15rem .4rem;border-radius:6px;border:1px solid var(--border);background:var(--surface2);font-weight:800;font-variant-numeric:tabular-nums}
.die.mx{border-color:var(--accent);color:var(--accent)}
.die.mn{border-color:var(--danger);color:var(--danger)}
.roll-tot{font-size:1.5rem;font-weight:800;color:var(--sc);margin-left:.3rem}

/* ── Notificação ── */
#toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:80;background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:var(--r);padding:.8rem 1.2rem;box-shadow:var(--shadow);font-size:1.05rem;max-width:min(560px,92vw);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
#toast .t-big{display:block;font-size:2rem;font-weight:800;color:var(--accent)}

.footer{display:flex;flex-wrap:wrap;gap:.6rem 1.2rem;align-items:center;justify-content:space-between;padding:.8rem 1.5rem;border-top:1px solid var(--border);background:var(--surface);font-size:.95rem;color:var(--text2)}
.fab{display:none}

/* ── Responsivo ── */

@media(max-width:1100px){
 .main{grid-template-columns:1fr}
 .side{position:fixed;top:0;right:0;height:100vh;max-height:none;width:min(340px,90vw);z-index:70;transform:translateX(105%);transition:transform .25s;box-shadow:var(--shadow)}
 .side.open{transform:none}
 .side-close{display:inline-flex;align-self:flex-end}
 .scrim{position:fixed;inset:0;background:rgba(5,3,10,.5);z-index:65}
 .scrim[hidden]{display:none}
 .fab{display:inline-flex;position:fixed;right:1rem;bottom:1rem;z-index:40;border-radius:99px;box-shadow:var(--shadow);min-height:48px;padding:.5rem 1.1rem}
 .res{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:640px){
 .hud{display:contents}
 .cond-bar{position:sticky;top:0;z-index:30;padding:.4rem 1rem;box-shadow:0 6px 16px rgba(0,0,0,.18)}
 html{font-size:16px}
 .hdr,.res,.stats-bar,.content,.footer{padding-left:1rem;padding-right:1rem}
 .tabs{padding:.4rem 1rem 0}
 .res{grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
 .rc-val{font-size:1.75rem}
 .grid,.panels{grid-template-columns:1fr}
 .mdl{padding:0;align-items:flex-end}
 .mdl-box{max-height:94vh;border-radius:16px 16px 0 0}
 .mh h2{font-size:1.5rem}
 .stats{grid-template-columns:1fr 1fr}
 .stats dd{font-size:.95rem}
 .mb{padding:1rem}
 .desc{font-size:1.1rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#fx{display:none}}
</style>

<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
<header class="hdr">
 <div class="hdr-id">

 </div>

 </aside>
</div>

<footer class="footer">

</footer>
</div>

</div>

{"id": "bola_fogo", "name": "Bola de Fogo", "nivel": "N3", "pm": "2", "school": "fogo", "lvl": "arcana 3 (fogo)", "exec": "Ação padrão", "alc": "30m", "alvo": "Explosão de 6m de raio", "dur": "Instantânea", "tr": "Reflexos reduz à metade", "cd": "CD 16", "desc": "Uma das mais famosas magias de ataque, a bola de fogo cria uma poderosa explosão de chamas. Você aponta o dedo e dispara uma pequena pedra flamejante, que explode quando atinge o local escolhido, causando 6d6 pontos de dano. Não é necessário fazer uma jogada de ataque, a menos que você queira lançar a bola de fogo através de uma passagem estreita. Neste caso, se errar, a bola de fogo pode bater em um obstáculo no caminho, explodindo antes do desejado.", "cael": "<strong>2 PM</strong> (Evocação Econômica). <strong>6d6+3</strong> (méd. 24). Maximizada (5 PM): <strong>39</strong>; com 3 pilhas de Em Chamas!: 42. Com Acumular Energia: 6d8+3 (méd. 30). O raio de 6m pega aliados: Fogo Amigo (2 PM, dura 1 hora) antes do combate.", "tags": ["Fogo", "Área", "Evocação Econômica"], "star": true, "prepared": true, "arcana": true},
{"id": "flecha_chamas", "name": "Flecha de Chamas", "nivel": "N3", "pm": "2", "school": "fogo", "lvl": "arcana 3 (fogo)", "exec": "Ação padrão", "alc": "9m", "alvo": "Até 5 flechas (ou outra munição)", "dur": "1 hora", "tr": "Nenhum", "cd": "—", "desc": "Você transforma até cinco flechas normais (ou qualquer outro tipo de munição, como virotes, pedras, balas...) em versões flamejantes, que causam 1d6 pontos de dano adicional.", "cael": "<strong>2 PM · 1 hora</strong> (Evocação Econômica). <strong>+1d6+3</strong> por flecha (aplicando ½ nível). Com Velocidade e ação completa: 2 disparos no turno. São só 5 munições: cada disparo gasta uma.", "tags": ["Fogo", "Arco", "Evocação Econômica", "1 hora"], "star": true, "prepared": true, "arcana": true},
{"id": "campo_forca", "name": "Campo de Força Menor", "nivel": "N3", "pm": "3", "school": "def", "lvl": "arcana 3 (abjuração, essência)", "exec": "Ação livre", "alc": "Pessoal", "alvo": "Você", "dur": "1 minuto", "tr": "Nenhum", "cd": "—", "desc": "Esta magia cria uma película protetora sobre a pele do arcano. A película absorve todos os golpes físicos, mas nenhum tipo de magia, dano elemental ou outros tipos de ataques. A magia se dissipa após absorver 20 pontos de dano.", "cael": "<strong>3 PM · ação livre · 1 minuto</strong>. Absorve <strong>só dano físico</strong>: magia, fogo, frio, eletricidade etc. passam direto. Por ser ação livre, ative no mesmo turno em que um inimigo de corpo a corpo encosta. O contador de absorção fica no topo da ficha.", "tags": ["Abjuração", "Ação livre", "Escudo 20"], "star": false, "prepared": true, "arcana": true},
{"id": "armadura_arcana", "name": "Armadura Arcana", "nivel": "N1", "pm": "1", "school": "def", "lvl": "arcana 1 (abjuração)", "exec": "Ação padrão", "alc": "Toque", "alvo": "1 criatura", "dur": "1 hora", "tr": "Nenhum", "cd": "—", "desc": "Esta magia envolve o alvo com um campo de força invisível, mas tangível, fornecendo +4 na classe de armadura. Esse bônus é cumulativo com outras magias (por exemplo, um mago com armadura arcana e escudo arcano recebe +8 na CA), mas não com bônus fornecido por armaduras.", "cael": "<strong>1 PM · 1 hora</strong>. CA 23 → <strong>27</strong>; com Velocidade, <strong>29</strong>. Acumula com outras magias, não com armadura. Lance no começo do dia de aventura.", "tags": ["Abjuração", "Essencial"], "star": true, "prepared": true, "arcana": true},
{"id": "fogo_amigo", "name": "Fogo Amigo", "nivel": "N2", "pm": "2", "school": "def", "lvl": "arcana 2 (abjuração)", "exec": "Ação padrão", "alc": "9m", "alvo": "Até 5 criaturas", "dur": "1 hora", "tr": "Nenhum", "cd": "—", "desc": "Os alvos desta magia podem ignorar qualquer dano e efeitos negativos causados pelas outras magias do conjurador. Caso haja outro conjurador no mesmo grupo, ele também deve lançar fogo amigo, ou suas magias poderão afetar seus aliados normalmente.", "cael": "<strong>2 PM · 1 hora · até 5 aliados</strong>. Destrava o kit de área da Cael: Bola de Fogo, Combustão em Massa e a explosão de Em Chamas! deixam de ferir o grupo. Lance junto com Armadura Arcana antes de entrar na masmorra.", "tags": ["Abjuração", "Grupo", "1 hora"], "star": true, "prepared": true, "arcana": true},
{"id": "dados_nimb", "name": "Dados de Nimb", "nivel": "N2", "pm": "2", "school": "def", "lvl": "arcana 2, divina 2 (encantamento, caos)", "exec": "Ação padrão", "alc": "9m", "alvo": "Até 6 criaturas", "dur": "1 rodada", "tr": "Vontade anula", "cd": "CD 15", "desc": "Esta ilusão afeta até seis pessoas, desde que cada uma não esteja separada das outras por mais de 1,5m. Todos os afetados acreditam em qualquer resultado escolhido pelo conjurador para um lance de dados, cartas exibidas ou ação semelhante. Se possuírem razão para desconfiar, têm direito a um teste de Vontade: sucesso indica que não são afetadas. Passada a duração da magia, a memória do resultado falso permanece, já que as criaturas afetadas viram em suas mentes aquele resultado.", "cael": "<strong>2 PM arcano</strong> · CD 15. Trapaça em jogo de azar, resultado falso de um sorteio, uma carta “revelada” que nunca existiu. Os alvos precisam estar a no máximo 1,5m uns dos outros. Só pede teste quem tem motivo para desconfiar.", "tags": ["Encantamento", "Caos", "Arcana/Divina", "RP"], "star": false, "prepared": true, "arcana": true},
{"id": "disfarce_ilusorio", "name": "Disfarce Ilusório", "nivel": "N1", "pm": "1", "school": "ilusao", "lvl": "arcana 1 (ilusão)", "exec": "Ação padrão", "alc": "Pessoal", "alvo": "Você", "dur": "1 hora", "tr": "Vontade (ao interagir)", "cd": "CD 14", "desc": "Você pode mudar sua aparência e a aparência de seu equipamento. Pode alterar sua altura, peso, tom de pele, etc. Esta magia fornece +10 em testes de Enganação para disfarces. Ela não oferece novas habilidades (você pode ficar parecido com outra raça, mas não ganhará nenhuma de suas habilidades raciais), nem muda seu equipamento (uma espada longa disfarçada como machado de batalha continua funcionando e causando dano como uma espada). Outras criaturas têm direito a um teste de Vontade para reconhecer a ilusão quando interagem com você.", "cael": "<strong>1 PM · 1 hora</strong>. O texto não limita tamanho: é o jeito de Cael <em>parecer</em> uma humana ou elfa, coisa que Alterar-se não alcança. Contrapartida: quem interage testa Vontade (CD 14).", "tags": ["Ilusão", "Disfarce", "Infiltração"], "star": false, "prepared": true, "arcana": true},
{"id": "imagem_silenciosa", "name": "Imagem Silenciosa", "nivel": "N1", "pm": "1", "school": "ilusao", "lvl": "arcana 1 (ilusão)", "exec": "Ação padrão", "alc": "30m", "alvo": "Ilusão visual de até 4 cubos de 1,5m", "dur": "Concentração", "tr": "Vontade anula", "cd": "CD 14", "desc": "Esta magia cria uma miragem, uma ilusão visual imaginada por você: pessoas, animais, monstros, mobília, paredes, fogo... Um conjurador inteligente usa ilusões para enganar inimigos de muitas maneiras. A ilusão não cria sons, cheiros, texturas ou temperaturas, apenas imagens (mas veja as outras versões da magia). Você pode mover a imagem como quiser, dentro dos limites de tamanho do efeito. Objetos e criaturas sólidas atravessam uma ilusão sem causar ou sofrer dano. Imagem silenciosa nunca causa dano (mas pode, por exemplo, esconder uma armadilha ou inimigos). Alguém que veja a imagem tem direito a um teste de Vontade para perceber que se trata de uma ilusão.", "cael": "<strong>1 PM · concentração</strong> · CD 14. Parede falsa, porta escondida, reforços que não existem. Só imagem: qualquer coisa que devesse fazer barulho entrega a farsa. Para som, suba para Imagem Menor.", "tags": ["Ilusão", "Concentração"], "star": false, "prepared": true, "arcana": true},
{"id": "alterar_se", "name": "Alterar-se", "nivel": "N2", "pm": "2", "school": "ilusao", "lvl": "arcana 2 (transmutação)", "exec": "Ação padrão", "alc": "Pessoal", "alvo": "Você", "dur": "1 hora (D)", "tr": "Nenhum", "cd": "—", "desc": "Você pode mudar sua aparência e forma — inclusive roupas e equipamento — para qualquer outra criatura, no máximo, uma categoria de tamanho menor ou maior. Você mantém suas estatísticas, mas recebe uma habilidade da forma selvagem do druida. Se sua nova forma não é capaz de falar ou não tem membros capazes de fazer gestos precisos, você não pode lançar magias até voltar a sua forma normal. Se usar esta magia para criar um disfarce, você recebe +10 no teste de Enganação.", "cael": "<strong>2 PM · 1 hora</strong>. Transformação real + uma habilidade da forma selvagem. <strong>Limite de tamanho:</strong> Cael é Mínima, então só alcança formas uma categoria acima (Minúscula), não uma humana. Forma sem fala ou sem mãos bloqueia magias até voltar.", "tags": ["Transmutação", "Disfarce", "Infiltração"], "star": false, "prepared": true, "arcana": true},
{"id": "imagem_menor", "name": "Imagem Menor", "nivel": "N2", "pm": "2", "school": "ilusao", "lvl": "arcana 2 (ilusão)", "exec": "Ação padrão", "alc": "30m", "alvo": "Ilusão de até 4 cubos de 1,5m", "dur": "Concentração", "tr": "Vontade anula", "cd": "CD 15", "desc": "Como imagem silenciosa, mas inclui sons simples. Por exemplo, uma fogueira feita com uma imagem silenciosa não emite som algum, mas com imagem menor pode crepitar como fogo real. Nenhuma delas, no entanto, vai emitir calor ou cheiro de fumaça. Uma imagem menor não pode reproduzir vozes ou diálogos, apenas sons simples.", "cael": "<strong>2 PM · concentração</strong> · CD 15. Passos, rosnado, porta batendo — sem vozes. Cobre o ponto fraco da Imagem Silenciosa sem precisar gastar um Som Fantasma junto.", "tags": ["Ilusão", "Concentração", "Som"], "star": false, "prepared": true, "arcana": true},
{"id": "imagem_maior", "name": "Imagem Maior", "nivel": "N3", "pm": "3", "school": "ilusao", "lvl": "arcana 3 (ilusão)", "exec": "Ação padrão", "alc": "30m", "alvo": "Ilusão de até 4 cubos de 1,5m", "dur": "Concentração", "tr": "Vontade anula", "cd": "CD 16", "desc": "Como imagem silenciosa, mas inclui ilusões sonoras, olfativas e térmicas. Enquanto se concentra, você pode deslocar a imagem dentro do alcance da magia.", "cael": "<strong>3 PM · concentração</strong> · CD 16. Som, cheiro e calor: a fogueira esquenta, o monstro fede. É a ilusão mais difícil de desmentir sem tocar nela.", "tags": ["Ilusão", "Concentração"], "star": false, "prepared": true, "arcana": true},
{"id": "esfera_invisibilidade", "name": "Esfera de Invisibilidade", "nivel": "N3", "pm": "3", "school": "ilusao", "lvl": "arcana 3 (ilusão)", "exec": "Ação padrão", "alc": "Pessoal", "alvo": "Esfera de 3m de raio em torno de 1 criatura ou objeto", "dur": "1 minuto (D)", "tr": "Nenhum", "cd": "—", "desc": "Como invisibilidade, mas todas as criaturas a até 3m do alvo (incluindo ele próprio) se tornam invisíveis. O centro do efeito é móvel, juntamente com o alvo. O efeito se mantém a até 3m do alvo; qualquer coisa que se estenda além desse limite fica visível.", "cael": "<strong>3 PM · 1 minuto</strong>. O grupo inteiro some, desde que fique colado no alvo. Quem passa dos 3m aparece. A regra de quebrar a invisibilidade ao atacar está no texto de <em>Invisibilidade</em>, que não veio na cópia.", "tags": ["Ilusão", "Invisibilidade", "Grupo"], "star": true, "prepared": true, "arcana": true},
{"id": "velocidade", "name": "Velocidade", "nivel": "N3", "pm": "3", "school": "util", "lvl": "arcana 3 (tempo)", "exec": "Ação padrão", "alc": "9m", "alvo": "1 criatura", "dur": "1 minuto", "tr": "Nenhum", "cd": "—", "desc": "O alvo se move e ataca rapidamente, recebendo +2 nas jogadas de ataque, CA e testes de Reflexos. Seu deslocamento aumenta em 9m e, se ele gastar uma ação completa, pode fazer um ataque adicional. Velocidade dissipa lentidão.", "cael": "<strong>3 PM · 1 minuto</strong>. Em Cael: CA 25 (29 com Armadura Arcana), Reflexos +6, voo 12m → 21m, 2 disparos com ação completa. Alcance 9m: num aliado de corpo a corpo o ataque extra pode render mais que em Cael.", "tags": ["Tempo", "Buff", "Auto/Aliado"], "star": true, "prepared": true, "arcana": true},
{"id": "toque_nada", "name": "Toque do Nada", "nivel": "N3", "pm": "3", "school": "util", "lvl": "arcana 3 (encantamento)", "exec": "Ação padrão", "alc": "Toque", "alvo": "1 criatura", "dur": "1 minuto", "tr": "Vontade anula", "cd": "CD 16", "desc": "Esta magia isola a mente do alvo de seu corpo, fazendo com que ele perca seus cinco sentidos. O alvo torna-se cego, surdo, sem paladar e olfato e anestesiado (sem tato). O alvo não fica mudo, mas tem muita dificuldade de articular palavras sem audição e tato: há apenas 25% de chance de que qualquer frase seja inteligível. No início de cada rodada, o alvo tem 50% de largar qualquer objeto que esteja segurando. Também tem 50% de chance de errar qualquer ataque, fica desprevenido e sofre uma penalidade de –4 na CA (para um total de –8). Move-se com metade do seu deslocamento (em uma direção aleatória), sofre uma penalidade de –8 em testes de perícias baseadas em Força ou Destreza e falha automaticamente em testes de Percepção. Além disso, precisa fazer um teste de Vontade para lançar qualquer magia (CD 10 + nível da magia). Uma magia afetada pelo talento Magia Silenciosa não sofre essa limitação.", "cael": "<strong>3 PM · toque</strong> · CD 16. Neutraliza um alvo por 1 minuto: CA −8, 50% de errar ataques, conjuradores precisam passar em Vontade para lançar. O risco é chegar ao toque: entre com Velocidade ou com um aliado na frente.", "tags": ["Encantamento", "Toque", "Controle"], "star": false, "prepared": true, "arcana": true},
{"id": "disco_flutuante", "name": "Disco Flutuante", "nivel": "N1", "pm": "1", "school": "util", "lvl": "arcana 1 (essência)", "exec": "Ação padrão", "alc": "9m", "alvo": "Disco de energia de 1m de diâmetro", "dur": "1 dia", "tr": "Nenhum", "cd": "—", "desc": "Você cria um plano de energia côncavo que carrega até 100kg. O disco segue o conjurador com deslocamento de 9m, flutuando 1m acima do chão. O disco desaparece se você se deslocar mais rápido e ele sair do alcance. Se o disco desaparecer, tudo que ele está carregando cai no chão.", "cael": "<strong>1 PM · 1 dia</strong>. Compensa a carga mínima da Sprite e carrega aliado caído. Cuidado: Cael voa 12m e o disco anda 9m — se ela correr na frente, a carga cai.", "tags": ["Essência", "Exploração", "1 dia"], "star": false, "prepared": true, "arcana": true},
{"id": "visao_cacador", "name": "Visão do Caçador", "nivel": "N3", "pm": "3", "school": "util", "lvl": "arcana 3 (transmutação)", "exec": "Ação padrão", "alc": "Pessoal", "alvo": "Você", "dur": "1 hora", "tr": "Nenhum", "cd": "—", "desc": "O conjurador ganha uma visão especial, enxergando objetos e criaturas pela quantidade de calor que emitem. Esta visão infravermelha permite ao arcano ver criaturas invisíveis e ignorar camuflagem (incluindo camuflagem total). Além disso, concede +5 em testes de percepção visuais para notar criaturas escondidas, +5 em testes de Sobrevivência para rastrear e +2 nas jogadas de ataque.", "cael": "<strong>3 PM · 1 hora</strong>. +2 nos ataques com arco por uma hora inteira, vê invisíveis e ignora camuflagem total. Com o Faro do familiar, fecha a cobertura contra furtividade.", "tags": ["Transmutação", "Visão", "Buff"], "star": false, "prepared": true, "arcana": true},
{"id": "maos_magicas", "name": "Mãos Mágicas", "nivel": "N0", "pm": "0", "school": "util", "lvl": "arcana 0 (transmutação)", "exec": "Ação padrão", "alc": "9m", "alvo": "1 objeto com até 2kg", "dur": "Concentração", "tr": "Nenhum", "cd": "—", "desc": "Você pode mover um objeto à distância. A cada rodada, você pode mover o objeto até 4,5m em qualquer direção (até o alcance da magia).", "cael": "<strong>0 PM</strong>. Alavancas, chaves e objetos suspeitos sem se expor. Com o tamanho Mínimo da Sprite, ótima para exploração furtiva.", "tags": ["Transmutação", "Sem PM", "Exploração"], "star": false, "prepared": true, "arcana": true},
{"id": "mensagem", "name": "Mensagem", "nivel": "N0", "pm": "0", "school": "util", "lvl": "arcana 0 (transmutação)", "exec": "Ação padrão", "alc": "30m", "alvo": "1 criatura", "dur": "1 minuto", "tr": "Nenhum", "cd": "—", "desc": "Você e o alvo podem trocar mensagens telepaticamente. Mensagem transmite som, não significado ou seja, você e o alvo devem falar um idioma comum para se entenderem.", "cael": "<strong>0 PM</strong>. Cael faz o reconhecimento voando e reporta em silêncio. Exige idioma em comum com o alvo.", "tags": ["Transmutação", "Sem PM", "Scouting"], "star": false, "prepared": true, "arcana": true},
{"id": "astucia_raposa", "name": "Astúcia da Raposa", "nivel": "N2", "pm": "2", "school": "util", "lvl": "arcana 2 (transmutação)", "exec": "Ação padrão", "alc": "Toque", "alvo": "1 criatura", "dur": "1 minuto", "tr": "Nenhum", "cd": "—", "desc": "Esta magia acelera o raciocínio do alvo, fornecendo Inteligência +4. Um aumento temporário de Inteligência não concede perícias ou PM adicionais, mas aumenta a CD para resistir a magias.", "cael": "<strong>2 PM · 1 minuto</strong>. INT 16 → 20 (mod +3 → +5): CD arcana <strong>13+N → 15+N</strong> (Bola de Fogo CD 18). Duração curta: só vale lançar no início de uma luta longa, antes das magias com TR. O toggle na barra lateral atualiza a CD exibida.", "tags": ["Transmutação", "Buff", "CD +2"], "star": false, "prepared": true, "arcana": true},
{"id": "orientacao", "name": "Orientação", "nivel": "N0", "pm": "0", "school": "natureza", "arcana": false, "lvl": "divina 0 (adivinhação)", "exec": "Ação padrão", "alc": "Toque", "alvo": "1 criatura", "dur": "1 minuto ou até ser descarregada", "tr": "Nenhum", "cd": "—", "desc": "O alvo desta magia recebe um bônus de +1 em uma jogada ou teste realizado dentro da duração da magia. O bônus deve ser usado antes da jogada ou teste ser feito.", "cael": "<strong>Divina · 0 PM</strong>. +1 gratuito antes de um teste importante (Sobrevivência, Adestrar Animais, Diplomacia). Declare antes de rolar.", "tags": ["Adivinhação", "Divina", "Sem PM"], "star": false, "prepared": true},
{"id": "purificar_alimentos", "name": "Purificar Alimentos", "nivel": "N0", "pm": "0", "school": "natureza", "arcana": false, "lvl": "divina 0 (transmutação)", "exec": "Ação padrão", "alc": "9m", "alvo": "Até 1kg de comida ou bebida", "dur": "Instantânea", "tr": "Nenhum", "cd": "—", "desc": "Esta magia purifica comida ou bebida suja, estragada, contaminada ou envenenada, deixando-a pronta para consumo.", "cael": "<strong>Divina · 0 PM</strong>. Água de poço suspeita, banquete de anfitrião duvidoso, rações estragadas: resolve sem custo.", "tags": ["Transmutação", "Divina", "Sem PM", "Exploração"], "star": false, "prepared": true},
{"id": "intuir_direcao", "name": "Intuir Direção", "nivel": "N0", "pm": "0", "school": "natureza", "arcana": false, "lvl": "arcana 0, divina 0 (adivinhação)", "exec": "Ação padrão", "alc": "Pessoal", "alvo": "Você", "dur": "Instantânea", "tr": "Nenhum", "cd": "—", "desc": "Você consegue sentir a direção norte, o que fornece +4 em testes de Sobrevivência para não se perder.", "cael": "<strong>Divina · 0 PM</strong>. Sobrevivência +12 +4 = <strong>+16 para não se perder</strong>.", "tags": ["Adivinhação", "Arcana/Divina", "Sem PM"], "star": false, "prepared": true},
{"id": "curar_ferimentos", "name": "Curar Ferimentos Leves", "nivel": "N1", "pm": "1", "school": "natureza", "arcana": false, "star": true, "lvl": "divina 1 (cura)", "exec": "Ação padrão", "alc": "Toque", "alvo": "1 criatura", "dur": "Instantânea", "tr": "Nenhum", "cd": "—", "desc": "Você canaliza energia positiva que recupera 1d8+1 pontos de vida da criatura tocada. Como mortos-vivos usam energia negativa, esta magia causa dano a eles.", "cael": "<strong>Divina · 1 PM</strong>. Cura <strong>1d8+1</strong> (méd. 5,5). O bônus de ½ nível é para <em>dano</em>, então não entra na cura. Contra morto-vivo vira dano variável: 1d8+1+3. Com 7 PM divinos, reserve para emergência; fora de combate, as poções e bálsamos do inventário.", "tags": ["Cura", "Divina", "Toque", "Emergência"], "prepared": true},
{"id": "detectar_animais", "name": "Detectar Animais", "nivel": "N1", "pm": "1", "school": "natureza", "arcana": false, "lvl": "divina 1 (adivinhação)", "exec": "Ação padrão", "alc": "9m", "alvo": "Emanação em cone", "dur": "Concentração, até 3 rodadas", "tr": "Nenhum", "cd": "—", "desc": "Você detecta a presença, quantidade e condição de todos os animais na área, conforme a quantidade de rodadas que gastar se concentrando. Na primeira rodada, você percebe a presença de animais; na segunda rodada, percebe a quantidade de animais; por fim, na terceira rodada, a localização e condição de cada animal. Condição depende dos PV atuais. Um animal com mais de 90% de seus PV está saudável; entre 25 a 90%, está razoável; com menos de 25% está fraco; e um animal com 0 ou menos PV está moribundo. Esta magia não atravessa barreiras que excedam 90cm de terra ou madeira, 30cm de pedra, 2,5cm de metal comum, ou uma folha fina de chumbo.", "cael": "<strong>Divina · 1 PM · concentração</strong>. Rodada 1 presença, 2 quantidade, 3 posição e condição. Só animais: não detecta humanoides nem monstros.", "tags": ["Adivinhação", "Divina", "Exploração"], "star": false, "prepared": true},
{"id": "remover_medo", "name": "Remover Medo", "nivel": "N1", "pm": "1", "school": "natureza", "arcana": false, "lvl": "divina 1 (abjuração)", "exec": "Ação padrão", "alc": "9m", "alvo": "1 criatura", "dur": "Instantânea", "tr": "Nenhum", "cd": "—", "desc": "Esta magia cura o alvo de qualquer efeito de medo.", "cael": "<strong>Divina · 1 PM</strong>. Aliado apavorado é um aliado fora do combate; 9m de alcance, sem toque.", "tags": ["Abjuração", "Divina", "Cura status"], "star": false, "prepared": true},

const KEY = 'cael_grimorio_estado_v1';
const DEF = {pv:56,pvMax:56,campo:0,campoMax:20,pma:27,pmaMax:27,pmd:7,pmdMax:7,pa:0,pilhas:0,buffs:{},fam:28,brasa:48,pets:{fam:{buffs:{}},brasa:{buffs:{},forma:'lobo',baforada:false}},theme:'fada',tab:'fogo'};
const LIMITS = {pvMax:56,campoMax:20,pmaMax:27,pmdMax:7,famMax:28,brasaMax:48};
let S = loadState();
let storageOk = true;

function loadState(){
 let s = JSON.parse(JSON.stringify(DEF));
 try{
  const raw = localStorage.getItem(KEY);
  if(raw){ const o = JSON.parse(raw); Object.assign(s, o); s.buffs = Object.assign({}, o.buffs||{}); }
  else { const t = localStorage.getItem('cael_grimorio_theme'); if(t) s.theme = t; }
 }catch(e){}
 Object.assign(s, {pvMax:LIMITS.pvMax,campoMax:LIMITS.campoMax,pmaMax:LIMITS.pmaMax,pmdMax:LIMITS.pmdMax});
 const cl=(v,mx)=>Math.max(0,Math.min(mx,Number(v)||0));
 s.pv=cl(s.pv,s.pvMax); s.campo=cl(s.campo,s.campoMax); s.pma=cl(s.pma,s.pmaMax); s.pmd=cl(s.pmd,s.pmdMax);
 s.pa=Math.max(0,Number(s.pa)||0); s.pilhas=cl(s.pilhas,3); s.fam=cl(s.fam,LIMITS.famMax); s.brasa=cl(s.brasa??LIMITS.brasaMax,LIMITS.brasaMax); delete s.comp;
 s.diario=normDiario(s.diario); s.extraPets=Array.isArray(s.extraPets)?s.extraPets.filter(x=>x&&x.id):[];
 if(!['sessoes','npcs','lugares','missoes','ganchos'].includes(s.dtab)) s.dtab='sessoes';
 const oc=s.cond||{}; s.cond={cael:[].concat(oc.cael||[]),brasa:[].concat(oc.brasa||[]),fam:[].concat(oc.fam||[])};
 const op=s.pets||{}; s.pets={fam:Object.assign({buffs:{}},op.fam), brasa:Object.assign({buffs:{},forma:'lobo',baforada:false},op.brasa)};
 if(!['fada','chamas','pergaminho'].includes(s.theme)) s.theme='fada';
 return s;
}
function save(){
 try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }
 catch(e){ storageOk = false; }
 const el = document.getElementById('save-flag');
 if(!el) return;
 if(storageOk){ const d=new Date(); el.className='save-flag'; el.textContent=`💾 Salvo ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
 else { el.className='save-flag err'; el.textContent='⚠ O navegador bloqueou o salvamento'; }
}

function calc(d,o){
 let die=d.d; if(o.acc && d.kind==='dmg' && STEP[die]) die=STEP[die];
 const parts=[];
 if(d.half){ parts.push(`+${HALF} (½ nível)`); }
 if(d.flat){ parts.push(`+${d.flat} (fixo da magia)`); }
 if(d.fire && S.pilhas){ parts.push(`+${S.pilhas} (Em Chamas! ×${S.pilhas})`); }
 const bonus=(d.half?HALF:0)+(d.flat||0)+(d.fire?S.pilhas:0);
 return {die,bonus,parts,min:d.n+bonus,max:d.n*die+bonus,avg:d.n*(die+1)/2+bonus,f:`${d.n}d${die}${bonus?'+'+bonus:''}`};
}
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',');

// ═══ DADOS ═══
function rnd(sides){ try{ const a=new Uint32Array(1); const lim=Math.floor(4294967296/sides)*sides; do{crypto.getRandomValues(a);}while(a[0]>=lim); return a[0]%sides+1; }catch(e){ return Math.floor(Math.random()*sides)+1; } }
function rollFormula(f,label){
 const m=f.match(/^(\d+)d(\d+)([+-]\d+)?$/i); if(!m) return;
 const n=+m[1],sd=+m[2],mod=m[3]?+m[3]:0; const dice=[]; for(let i=0;i<n;i++) dice.push(rnd(sd));
 const tot=dice.reduce((a,b)=>a+b,0)+mod;
 const crit = (n===1&&sd===20) ? (dice[0]===20?' — CRÍTICO!':dice[0]===1?' — falha crítica':'') : '';
 toast(`${label} · ${f}${crit}<span class="t-big">${tot}</span>${n>1||mod?`<small>${dice.join(' + ')}${mod?(mod>0?' + ':' − ')+Math.abs(mod):''}</small>`:''}`, 3500);
}

function condSet(ent){
 const set=new Map(); (S.cond[ent]||[]).forEach(id=>set.set(id,null));
 let grew=true; while(grew){ grew=false; for(const [id] of [...set]) (COND[id].imp||[]).forEach(x=>{ if(!set.has(x)){ set.set(x,id); grew=true; } }); }
 return set; // id → null (marcada) ou id de quem a causou
}
function condMods(ent){
 const E=ENT[ent], set=condSet(ent), has=id=>set.has(id);
 let F=E.FOR, D=E.DES;
 if(has('exausto')){F-=6;D-=6;} else if(has('fatigado')){F-=2;D-=2;}
 if(has('paralisado')){F=0;D=0;}
 const dF=modN(F)-modN(E.FOR), dD=modN(D)-modN(E.DES);
 const fear=(has('abalado')||has('apavorado'))?-2:0;
 const atk=fear+(has('agarrado')?-2:0)+(has('lento')?-1:0);
 const m={
  melee: atk+(E.dexMelee?dD:dF)+(has('caido')?-4:0),
  ranged: atk+dD,
  dmg: E.dexMelee?0:dF,
  ca: dD+(has('desprevenido')?-4:0)+(has('cego')?-4:0)+(has('lento')?-1:0),
  caFix: has('indefeso')?5+E.size:null,
  ref: fear+dD+(has('lento')?-1:0), fort: fear, von: fear, init: fear+dD, abil: fear,
  deslZero: has('agarrado')||has('paralisado')||has('inconsciente'),
  deslHalf: has('cego')||has('caido')||has('lento')||has('exausto'),
  dF, dD, F, D, set,
 };
 const f=[];
 if(has('inconsciente')) f.push('<strong>Inconsciente</strong>');
 else if(has('paralisado')) f.push('<strong>Paralisado: só ações mentais</strong>');
 else if(has('atordoado')) f.push('<strong>Atordoado: não pode agir</strong>');
 else if(has('pasmo')) f.push('<strong>Pasmo: não pode agir</strong> (defende normalmente)');
 else if(has('enjoado')||has('lento')) f.push('<strong>Só uma ação padrão OU de movimento</strong> por rodada');
 m.act = f.length ? f[0].replace(/<[^>]+>/g,'') : '';
 if(has('apavorado')) f.push('tenta fugir a todo custo');
 if(has('cego')) f.push('50% de chance de errar ataques');
 if(m.deslZero) f.push('não pode se mover'); else if(m.deslHalf) f.push('deslocamento à metade');
 if(has('fatigado')||has('exausto')) f.push('não pode correr nem fazer investida');
 if(has('caido')) f.push('inimigos: +4 corpo a corpo, −4 à distância contra ele');
 if(has('indefeso')) f.push(`CA ${5+E.size} (5 + tamanho) · golpe de misericórdia`);
 if(fear) f.push('testes de habilidade e perícias −2');
 if(dD||dF) f.push(`FOR ${sg(dF)} e DES ${sg(dD)} no modificador`);
 if(has('sangrando')) f.push('1d4 de dano no início de cada turno');
 m.flags=f;
 return m;
}

function addCond(ent,id){
 const L=S.cond[ent], has=x=>L.includes(x), rm=x=>{const i=L.indexOf(x); if(i>=0) L.splice(i,1);};
 const who=ENT[ent].n; let msg='';
 if(id==='abalado'&&(has('abalado')||has('apavorado'))){ rm('abalado'); if(!has('apavorado')) L.push('apavorado'); msg=`😱 ${who} ficou abalado de novo: agora está Apavorado.`; }
 else if((id==='fatigado'||id==='exausto')&&(has('exausto')||has('inconsciente'))){ rm('exausto'); rm('fatigado'); if(!has('inconsciente')) L.push('inconsciente'); msg=`💤 ${who} já estava exausto: caiu Inconsciente.`; }
 else if(id==='fatigado'&&has('fatigado')){ rm('fatigado'); L.push('exausto'); msg=`🥵 ${who} fatigado de novo: agora está Exausto.`; }
 else if(id==='exausto'){ rm('fatigado'); L.push('exausto'); }
 else if(has(id)){ rm(id); }
 else L.push(id);
 condChanged(ent,msg);
}
function rmCond(ent,id){ const L=S.cond[ent]; const i=L.indexOf(id); if(i>=0) L.splice(i,1); condChanged(ent); }
function dissipaLento(ent){ const L=S.cond[ent]; const i=L.indexOf('lento'); if(i>=0){ L.splice(i,1); toast(`🐢 Velocidade dissipou a lentidão de ${ENT[ent].n}.`); } }
function bleed(ent){
 const r=rnd(4);
 if(ent==='cael'){ S.pv=Math.max(0,S.pv-r); } else { S[ent]=Math.max(0,S[ent]-r); }
 condChanged(ent,`🩸 ${ENT[ent].n} sangrou ${r} PV.`);
}
function conTest(ent){
 const E=ENT[ent], m=condMods(ent), r=rnd(20), mo=modN(E.CON)+m.abil, tot=r+mo, ok=tot>=15;
 if(ok){ const L=S.cond[ent]; L.splice(L.indexOf('sangrando'),1); }
 condChanged(ent); toast(`Teste de CON · ${ENT[ent].n}: ${r} ${mo>=0?'+':'−'} ${Math.abs(mo)}<span class="t-big">${tot}</span>${ok?'Passou (CD 15): parou de sangrar.':'Falhou (CD 15): continua sangrando.'}`,3500);
}

  let input;

  else if(type==='select') input=`<select name="${name}" id="f-${name}">${opt.map(o=>`<option${o===v?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else input=`<input name="${name}" id="f-${name}" type="${type}" value="${esc(v)}"${type==='number'?' step="1"':''}>`;

 K.fields.forEach(([name,,type])=>{ const v=fd.get(name); o[name]= type==='number' ? (v===''||v===null?null:parseInt(v,10)) : String(v??'').trim(); });
 const first=K.fields.find(f=>f[2]!=='date'&&f[2]!=='select')[0];

 if(F.id){ const it=list.find(x=>x.id===F.id); Object.assign(it,o); if(F.kind==='pets') it.pv=Math.min(it.pv??o.pvMax,o.pvMax); }
 else { const n=Object.assign({id:uid(),criado:Date.now()},o); if(F.kind==='pets'){ n.pv=n.pvMax; n.buffs={}; } list.push(n); }

// ── backup e exportação ──
function baixar(nome,conteudo,tipo){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo})); a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function exportBackup(){
 baixar(`cael_backup_${hoje()}.json`, JSON.stringify({app:'grimorio-cael',versao:1,exportado:new Date().toISOString(),estado:S},null,1),'application/json');
 toast('💾 Backup baixado. Guarde o arquivo junto com o grimório.');
}
function importBackup(inp){
 const f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
 const r=new FileReader();
 r.onload=()=>{
  let o; try{ o=JSON.parse(r.result); }catch(e){ toast('⚠ Arquivo inválido: não é um JSON.'); return; }
  const est=o&&o.estado?o.estado:o;
  if(!est||typeof est!=='object'||!('pv' in est)||!('pma' in est)){ toast('⚠ Esse arquivo não parece um backup do grimório.'); return; }
  const n=est.diario?['sessoes','npcs','missoes'].map(k=>(est.diario[k]||[]).length):[0,0,0];
  if(!confirm(`Importar backup${o.exportado?' de '+new Date(o.exportado).toLocaleString('pt-BR'):''}?\n${n[0]} sessões · ${n[1]} NPCs · ${n[2]} missões\n\nIsso SUBSTITUI todo o estado atual (PV, PM, diário, companheiros).`)) return;
  try{ localStorage.setItem(KEY,JSON.stringify(est)); }catch(e){ toast('⚠ O navegador bloqueou o salvamento.'); return; }
  location.reload();
 };
 r.readAsText(f);
}
function exportDiarioTxt(){
 const D=S.diario, L=[], line=s=>L.push(s), sec=s=>{line('');line('══ '+s+' ══');};
 line('DIÁRIO DE CAMPANHA — CAEL'); line('Exportado em '+dataBR(hoje()));
 sec('SESSÕES'); [...D.sessoes].sort((a,b)=>(a.data||'').localeCompare(b.data||'')||a.criado-b.criado).forEach(s=>{line('');line(`Sessão ${sessaoNum(s.id)} · ${dataBR(s.data)}${s.titulo?' — '+s.titulo:''}`);if(s.resumo)line(s.resumo);if(s.recompensas)line('Recompensas: '+s.recompensas);});
 sec('MISSÕES'); sortedList('missoes').forEach(m=>line(`• [${m.status}] ${m.titulo}${m.contratante?' (pedida por '+m.contratante+')':''}${m.recompensa?' — recompensa: '+m.recompensa:''}${m.notas?'\n  '+m.notas.replace(/\n/g,'\n  '):''}`));
 sec('PISTAS E MISTÉRIOS'); sortedList('ganchos').forEach(g=>line(`• [${g.status}] ${g.texto.replace(/\n/g,' ')}${g.origem?' (surgiu em: '+g.origem+')':''}`));
 sec('NPCS'); sortedList('npcs').forEach(n=>line(`• ${n.nome}${n.papel?' — '+n.papel:''} [${n.atitude}, ${n.status}]${n.local?' · '+n.local:''}${n.notas?'\n  '+n.notas.replace(/\n/g,'\n  '):''}`));
 sec('LUGARES'); sortedList('lugares').forEach(l=>line(`• ${l.nome}${l.regiao?' ('+l.regiao+')':''} [${l.visitado}]${l.notas?'\n  '+l.notas.replace(/\n/g,'\n  '):''}`));
 sec('TESOURO E XP'); line(`${D.to} TO · ${D.xp} XP`);
 baixar(`cael_diario_${hoje()}.txt`, L.join('\n'), 'text/plain;charset=utf-8');
}

// ═══ PARTÍCULAS (sutis, só nos temas escuros) ═══
class FX{
 constructor(c){this.c=c;this.x=c.getContext('2d');this.p=[];addEventListener('resize',()=>this.size());this.size();this.reset();this.loop=this.loop.bind(this);requestAnimationFrame(this.loop);}
 size(){this.c.width=innerWidth;this.c.height=innerHeight;}
 reset(){this.p=[];for(let i=0;i<28;i++){const q=this.mk();q.life=Math.random()*q.max;this.p.push(q);}}
 mk(){const fire=S.theme==='chamas';return{x:Math.random()*this.c.width,y:fire?this.c.height+5:Math.random()*this.c.height,r:Math.random()*1.8+.6,vx:(Math.random()-.5)*.3,vy:fire?-(Math.random()*.6+.2):(Math.random()-.5)*.2,life:0,max:2+Math.random()*2,h:fire?25+Math.random()*20:270+Math.random()*50};}
 loop(){requestAnimationFrame(this.loop);if(S.theme==='pergaminho')return;const x=this.x;x.clearRect(0,0,this.c.width,this.c.height);
  this.p.forEach((q,i)=>{q.x+=q.vx;q.y+=q.vy;q.life+=.006;if(q.life>=q.max||q.y<-10){this.p[i]=this.mk();return;}const a=Math.sin(q.life/q.max*Math.PI)*.7;x.fillStyle=`hsla(${q.h},90%,72%,${a})`;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();});}
}

// ═══ EXPORTAR ═══
function exportarMagias() {
  const schoolNames = {
    fogo:'🔥 Fogo', def:'🛡 Defesa', ilusao:'🎭 Ilusão',
    natureza:'🌿 Natureza', util:'🔧 Utilidade', sprite:'✨ Sprite'
  };
  const schoolOrder = ['fogo','def','ilusao','natureza','util','sprite'];

  let html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Magias de Cael — Grimório</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=IM+Fell+English&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#1a1020;color:#e8ddf5;font-family:'IM Fell English',Georgia,serif;padding:2rem;max-width:900px;margin:0 auto}
  h1{font-family:'Cinzel',serif;font-size:2rem;color:#c084f5;text-align:center;margin-bottom:.3rem;letter-spacing:.1em}
  .subtitulo{text-align:center;font-size:.9rem;color:#9070b0;margin-bottom:2.5rem;font-style:italic}
  .escola{margin-bottom:2.5rem;page-break-inside:avoid}
  .escola-titulo{font-family:'Cinzel',serif;font-size:1.2rem;color:#e9c46a;border-bottom:2px solid #4a2060;padding-bottom:.4rem;margin-bottom:1rem;letter-spacing:.08em}
  .magia{background:#1e1030;border:1px solid #3a1f55;border-radius:6px;padding:1rem 1.2rem;margin-bottom:.8rem;page-break-inside:avoid}
  .magia-head{display:flex;align-items:baseline;gap:.8rem;margin-bottom:.5rem;flex-wrap:wrap}
  .magia-nome{font-family:'Cinzel',serif;font-size:1rem;font-weight:700;color:#d8b4fe}
  .magia-nivel{font-size:.75rem;color:#9070b0;border:1px solid #4a2060;border-radius:3px;padding:.1rem .4rem}
  .magia-pm{font-size:.78rem;color:#f0a500;font-weight:bold}
  .magia-meta{display:flex;gap:1.5rem;font-size:.78rem;color:#7a608a;margin-bottom:.6rem;flex-wrap:wrap}
  .magia-meta span strong{color:#b09ac0}
  .magia-desc{font-size:.88rem;color:#c8b8e0;line-height:1.6;margin-bottom:.5rem}
  .magia-cael{font-size:.82rem;color:#a0f0c0;background:#0a1a10;border-left:3px solid #30a060;padding:.5rem .75rem;border-radius:0 4px 4px 0;line-height:1.5}
  .magia-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .tag{font-size:.65rem;background:#2a1040;color:#9070b0;border:1px solid #3a1f55;border-radius:3px;padding:.1rem .45rem}
  .footer-exp{text-align:center;margin-top:3rem;font-size:.75rem;color:#5a4070;font-style:italic}
  @media print{body{background:white;color:#111}.magia{border-color:#ccc;background:#faf5ff}.magia-cael{background:#f0fff0;color:#1a4a1a}}
</style></head><body>
<h1>✦ Grimório de Cael ✦</h1>
<div class="subtitulo">Sprite · Druida Ermitã / Mago Evocador · Devota de Wynna</div>`;

  for (const school of schoolOrder) {
    const spells = SPELL_DB.filter(s => s.school === school && !s.off);
    if (!spells.length) continue;
    html += `<div class="escola"><div class="escola-titulo">${schoolNames[school]}</div>`;
    for (const s of spells) {
      const pmLabel = s.arcana ? `${s.pm} PM` : `${s.pm} PM Divino`;
      html += `<div class="magia">
  <div class="magia-head">
    <span class="magia-nome">${s.name}</span>
    <span class="magia-nivel">${s.nivel}</span>
    <span class="magia-pm">${pmLabel}</span>
  </div>
  <div class="magia-meta">
    <span><strong>Execução:</strong> ${s.exec}</span>
    <span><strong>Alcance:</strong> ${s.alc}</span>
    <span><strong>Alvo:</strong> ${s.alvo}</span>
    <span><strong>Duração:</strong> ${s.dur}</span>
    ${s.tr !== 'Nenhum' ? `<span><strong>Resistência:</strong> ${s.tr} ${s.cd !== '—' ? '('+s.cd+')':''}</span>` : ''}
  </div>
  ${s.lvl ? `<div class="magia-meta"><span><strong>Nível:</strong> ${s.lvl}</span></div>` : ''}
  <div class="magia-desc">${s.desc}</div>
  <div class="magia-cael">💡 <strong>Cael:</strong> ${s.cael}</div>
  <div class="magia-tags">${(s.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
</div>`;
    }
    html += `</div>`;
  }

  html += `<div class="footer-exp">Gerado a partir do Grimório Interativo de Cael · Tormenta RPG</div></body></html>`;

  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cael_magias.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showAlert('📄 Magias exportadas! Abra o arquivo para imprimir ou salvar.', 2500);
}
